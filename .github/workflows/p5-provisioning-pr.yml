name: P5 provisioning pull request

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Repository-relative path to an AzureForge YAML service specification"
        required: true
        default: "examples/pricing-api.yaml"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-provisioning-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate service specification path
        shell: bash
        run: |
          set -euo pipefail

          spec="${{ inputs.spec }}"

          if [[ "$spec" != examples/*.yaml ]]; then
            echo "error: spec must be an examples/*.yaml repository path"
            exit 1
          fi

          if [[ ! -f "$spec" ]]; then
            echo "error: service specification not found: $spec"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build AzureForge CLI
        run: dotnet build --configuration Release

      - name: Test AzureForge CLI
        run: dotnet test --configuration Release --no-build

      - name: Generate deterministic desired state
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .azureforge

          dotnet run \
            --project src/AzureForge.Cli \
            --configuration Release \
            --no-build \
            -- generate \
            "${{ inputs.spec }}" \
            --output .azureforge/desired-state.tfvars.json

      - name: Prepare provisioning artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          service_name="$(jq -r '.service_name' .azureforge/desired-state.tfvars.json)"
          environment="$(jq -r '.environment' .azureforge/desired-state.tfvars.json)"

          if [[ -z "$service_name" || "$service_name" == "null" ]]; then
            echo "error: generated desired state does not contain service_name"
            exit 1
          fi

          if [[ -z "$environment" || "$environment" == "null" ]]; then
            echo "error: generated desired state does not contain environment"
            exit 1
          fi

          destination="provisioning/services/${service_name}/${environment}.tfvars.json"
          branch="azureforge/provision/${service_name}-${environment}"

          echo "service_name=$service_name" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create provisioning branch
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ steps.artifact.outputs.branch }}"
          destination="${{ steps.artifact.outputs.destination }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi

          mkdir -p "$(dirname "$destination")"
          cp .azureforge/desired-state.tfvars.json "$destination"

          git add "$destination"

          if git diff --cached --quiet; then
            echo "No desired-state changes detected."
          else
            git commit -m "provision: ${{ steps.artifact.outputs.service_name }} ${{ steps.artifact.outputs.environment }}"
          fi

          git push -u origin "$branch"

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ steps.artifact.outputs.branch }}"
          service="${{ steps.artifact.outputs.service_name }}"
          environment="${{ steps.artifact.outputs.environment }}"
          destination="${{ steps.artifact.outputs.destination }}"

          existing_pr="$(
            gh pr list \
              --head "$branch" \
              --base "${{ github.event.repository.default_branch }}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          body="$(cat <<EOF
          ## AzureForge provisioning request

          This pull request was generated by the AzureForge P5 provisioning workflow.

          **Service:** \`$service\`
          **Environment:** \`$environment\`
          **Source specification:** \`${{ inputs.spec }}\`
          **Generated desired state:** \`$destination\`

          ### Review boundary

          This pull request contains deterministic desired state only.

          It does **not** run Terraform, authenticate to Azure, or provision infrastructure.

          Human review and merge are required before later provisioning automation may consume this desired state.
          EOF
          )"

          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --title "provision: $service $environment" \
              --body "$body"

            echo "Updated existing pull request #$existing_pr"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "provision: $service $environment" \
              --body "$body"
          fi
